name: Nueva frase
description: Agregar una frase al widget del clima de la tele
title: "Nueva frase"
labels: ["frase"]
body:
  - type: dropdown
    id: rango
    attributes:
      label: Rango
      description: Cuándo se muestra (sensación térmica, o lluvia, tormenta o nieve).
      options:
        - "35° o más"
        - "30° a 34°"
        - "25° a 29°"
        - "19° a 24°"
        - "13° a 18°"
        - "7° a 12°"
        - "6° o menos"
        - "Lluvia"
        - "Tormenta"
        - "Nieve"
    validations:
      required: true
  - type: input
    id: frase
    attributes:
      label: Frase
      description: Hasta 40 caracteres. Va después de la temperatura, por ejemplo "30° Hace un re lorca".
      placeholder: Hace un re lorca
    validations:
      required: true
