name: AI phrases

# Every Monday at 09:00 Buenos Aires time (12:00 UTC), and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      phrases_per_category:
        description: "New phrases per category"
        default: "2"

permissions:
  contents: write   # to commit phrases/phrases.json

concurrency:
  group: phrases
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest main, not the commit the event fired on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask Gemini for new phrases
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PHRASES_PER_CATEGORY: ${{ inputs.phrases_per_category || '2' }}
        run: python scripts/generate_phrases.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phrases/phrases.json
          if git diff --cached --quiet; then echo "No new phrases."; exit 0; fi
          git commit -m "phrases: add AI-generated phrases"
          git pull --rebase origin main
          git push
