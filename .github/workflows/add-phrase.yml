name: Add phrase

# The "New phrase" issue form. Only issues opened by the repository owner are applied; others are left alone.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: phrases
  cancel-in-progress: false

jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'phrase') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest main, not the commit the event fired on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add the phrase
        id: phrase
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python scripts/add_phrase.py > result.txt
          echo "ok=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: Commit changes
        if: steps.phrase.outputs.ok == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phrases/phrases.json
          git commit -m "phrases: add phrase (#${{ github.event.issue.number }})"
          git pull --rebase origin main
          git push
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file result.txt
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
