name: Frases nuevas con IA

# Every Monday at 9:00 Buenos Aires time (12:00 UTC), and by hand from the Actions tab.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      nuevas_por_rango:
        description: "Frases nuevas por rango"
        default: "2"

permissions:
  contents: write   # to commit frases/frases.json

concurrency:
  group: frases
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pedir frases a Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NUEVAS_POR_RANGO: ${{ inputs.nuevas_por_rango || '2' }}
        run: python scripts/generar_frases.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frases/frases.json
          if git diff --cached --quiet; then echo "Sin frases nuevas."; exit 0; fi
          git commit -m "frases: nuevas frases generadas con IA"
          git push
